name: ci

on:
  pull_request:
    branches: [main, phase-2.0]
  push:
    branches: [main, phase-2.0]

jobs:
  verify:
    name: typecheck / test / lint / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.check.json

      - name: Unit tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx next build
        env:
          # Build expects these at compile time even if unused at runtime.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  lighthouse:
    name: lighthouse (advisory)
    runs-on: ubuntu-latest
    needs: verify
    # Advisory in T01: full Lighthouse run is wired up once /week (T08) and
    # /coach/[uuid] (T13) routes exist. Baseline is locked in T16.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.x
          lhci autorun --config=./.lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
